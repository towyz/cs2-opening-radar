[project]
name = "cs2-opening-analyzer-backend"
version = "0.1.0"
description = "FastAPI backend for CS2 Opening Analyzer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
